name: news-personal-local
services:
  db:
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    environment:
      POSTGRES_DB: news_personal
      POSTGRES_USER: news_personal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.local}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - personal_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_personal -d news_personal"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  personal_pg18:
