name: Fundação

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: F-02 / verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEWS_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.5+8'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar Chromium e bibliotecas do runner
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm exec -- playwright install --with-deps chromium
      - name: Executar o mesmo gate local
        run: python3 scripts/verify
      - name: Confirmar limpeza dos recursos desta execução
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: node frontend/scripts/e2e.mjs --cleanup
      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        with:
          name: f02-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*/
          if-no-files-found: error
          retention-days: 14
